<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Flick</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation bar -->
    <nav>
        <h1>Flick</h1>

        <div>
            <a href="index.html">Home</a>
            <a href="jobs.html">Find Jobs</a>
            <a href="saved.html">Saved Jobs</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>


    <!-- Contact page -->
    <main class="contact-page">

        <h2>Contact Flick</h2>

        <p>
            Use this form to report a problem with Flick or give feedback.
        </p>


        <!-- Contact form -->
        <form action="#" class="contact-form">

            <div class="contact-field">

                <label for="contact-name">
                    Name
                </label>

                <input
                    type="text"
                    id="contact-name"
                    required
                >

            </div>


            <div class="contact-field">

                <label for="contact-email">
                    Email
                </label>

                <input
                    type="email"
                    id="contact-email"
                    required
                >

            </div>


            <div class="contact-field">

                <label for="contact-message">
                    Message
                </label>

                <textarea
                    id="contact-message"
                    rows="6"
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="contact-button"
            >
                Submit
            </button>

        </form>


        <p class="contact-note">
            This is a prototype contact form and does not currently send messages.
        </p>

    </main>

</body>

</html>
